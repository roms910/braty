<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Motion Cam</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0B1116;color:#EAF0F4;font:16px/1.4 system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
nav{display:flex;padding:8px 14px;gap:4px}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:8px;font-weight:700;color:#93A4B1}
nav button.on{color:#EAF0F4;border-color:#5B7CFF}
section{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:6px 14px}
#frame{position:relative;overflow:hidden;border-radius:16px;background:#000;box-shadow:0 0 0 2px #2A3844}
#frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#info{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:.8rem;color:#93A4B1}
#msg{position:absolute;bottom:10px;left:14px;right:14px;text-align:center;font-weight:600;text-shadow:0 1px 4px #000}
#panel{background:#101922;border-radius:22px 22px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip,.pill{flex:none;background:#1A242D;border:2px solid #2A3844;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92rem;cursor:pointer}
.chip.on,.pill.on{background:#5B7CFF;border-color:#5B7CFF;color:#0B1116}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.lbl{font-size:.8rem;color:#93A4B1;flex:none;width:44px}
.dur{flex:none;display:flex;align-items:center;gap:6px;background:#1A242D;border:2px solid #2A3844;border-radius:999px;padding:2px 12px}
.dur input{width:48px;background:none;border:0;text-align:center;font-weight:800;padding:4px 0;-moz-appearance:textfield}
.dur span{font-size:.85rem;color:#93A4B1}
.ctl{display:flex;align-items:center;justify-content:space-between}
.ctl .pill{width:104px;text-align:center}
#ring{--p:0;width:88px;height:88px;border-radius:50%;padding:6px;background:conic-gradient(#5B7CFF calc(var(--p)*360deg),#2A3844 0)}
#shot{width:100%;height:100%;border-radius:50%;background:#fff;border:5px solid #101922;cursor:pointer}
#shot:active{background:#C8D3FF}#shot:disabled{opacity:.45}
#set{position:absolute;inset:0;background:#000B;display:flex;align-items:flex-end;z-index:3}
#set[hidden],#res[hidden]{display:none}
#set>div{width:100%;background:#101922;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:14px}
#set h2{margin:0;font-size:1.1rem}#set p{margin:0;color:#93A4B1;font-size:.85rem}
#conv{padding:8px 16px;overflow:auto;display:block}
.slot{position:relative;display:block;background:#16212A;border:2px solid #2A3844;border-radius:12px;padding:14px 16px;margin-bottom:12px}
.slot.done{border-color:#5B7CFF}
.slot input{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.slot b{display:block}.slot span{color:#93A4B1;font-size:.9rem;word-break:break-all}
.fld{margin:16px 0}.fld label{display:block;font-weight:700;margin-bottom:6px}
.fld input{width:100%;background:#16212A;border:2px solid #2A3844;border-radius:12px;padding:12px}
.big{width:100%;font-weight:800;font-size:1.05rem;color:#0B1116;background:#5B7CFF;border:0;border-radius:12px;padding:15px}
.big:disabled{opacity:.4}.big.alt{background:#1A242D;color:#EAF0F4;border:2px solid #2A3844}
#res{position:fixed;inset:0;background:#0B1116;z-index:5;display:flex;flex-direction:column;gap:12px;padding:calc(16px + env(safe-area-inset-top,0)) 16px calc(16px + env(safe-area-inset-bottom,0))}
#ri{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:12px;background:#000}
#rt{margin:0;text-align:center;color:#93A4B1}
</style>
</head>
<body>
<div id="app">
<nav><button id="t1" class="on">Kamera</button><button id="t2">Konverter</button></nav>

<section id="cam">
<div id="stage"><div id="frame"><video id="v" playsinline muted autoplay></video></div><div id="info"></div><div id="msg">Memulai kamera…</div></div>
<div id="panel">
<div class="row"><span class="lbl">Rasio</span><div class="chips" id="asp"></div></div>
<div class="row"><span class="lbl">Durasi</span><div class="chips" id="dch"></div><label class="dur"><input id="dur" type="number" inputmode="decimal" min="1" max="15" step="0.5" aria-label="Durasi video dalam detik"><span>dtk</span></label></div>
<div class="ctl"><button class="pill" id="fl" aria-pressed="false">Flash mati</button><div id="ring"><button id="shot" aria-label="Jepret" disabled></button></div><button class="pill" id="gear">Kualitas</button></div>
</div>
<div id="set" hidden><div>
<h2>Kualitas video</h2>
<div class="row"><span class="lbl" style="width:auto">Resolusi</span><div class="chips" id="rch"></div></div>
<div class="row"><span class="lbl" style="width:auto">FPS</span><div class="chips" id="fch"></div></div>
<p>Maks memakai resolusi tertinggi kamera HP. Resolusi dan FPS lebih tinggi butuh HP yang kuat dan file lebih besar.</p>
<button class="big" id="apply">Terapkan</button>
</div></div>
</section>

<section id="conv" hidden>
<label class="slot" id="s1"><input type="file" id="img" accept="image/jpeg"><b>1. Pilih foto JPG</b><span id="n1">Belum dipilih</span></label>
<label class="slot" id="s2"><input type="file" id="vid" accept="video/mp4"><b>2. Pilih video MP4</b><span id="n2">Belum dipilih</span></label>
<div class="fld"><label for="ts">Detik foto muncul di dalam video</label><input id="ts" type="number" min="0" step="0.1" inputmode="decimal" value="0"></div>
<button class="big" id="go" disabled>Buat Motion Photo</button>
</section>
</div>

<div id="res" hidden>
<img id="ri" alt="Hasil">
<p id="rt"></p>
<button class="big" id="sv">Simpan</button>
<button class="big alt" id="sh">Bagikan / kirim ke Google Foto</button>
<button class="big alt" id="again">Kembali</button>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var A={'3:4':3/4,'4:3':4/3,'1:1':1,'9:16':9/16,'16:9':16/9,'Full':0};
var R={'720':[1280,720],'1080':[1920,1080],'max':[3840,2160]};
var st={ar:'3:4',res:'1080',fps:30,dur:3};
try{Object.assign(st,JSON.parse(localStorage.getItem('mc')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('mc',JSON.stringify(st))}catch(e){}}
var v=$('v'),msg=$('msg'),shot=$('shot'),cv=document.createElement('canvas'),g=cv.getContext('2d');
var stream,track,ic,enc,desc,cr,ring=[],lastKey=-1e9,busy=false,flash=false,looping=false,result=null;
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function say(t){msg.textContent=t||''}

/* ---------- UI ---------- */
function mk(el,list,sel,cb){el.innerHTML='';list.forEach(function(o){var b=document.createElement('button');b.textContent=o.t;b.className='chip'+(String(o.v)===String(sel())?' on':'');b.onclick=function(){cb(o.v);mk(el,list,sel,cb)};el.appendChild(b)})}
function tab(n){$('cam').hidden=n!==1;$('conv').hidden=n!==2;$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);if(n===1)fit()}
$('t1').onclick=function(){tab(1)};$('t2').onclick=function(){tab(2)};
function fit(){
  var s=$('stage'),w=s.clientWidth-28,h=s.clientHeight-12,ar=A[st.ar]||(v.videoWidth/v.videoHeight)||.75;
  if(w<=0||h<=0)return;
  var fh=w/ar,fw=w;if(fh>h){fh=h;fw=h*ar}
  $('frame').style.width=fw+'px';$('frame').style.height=fh+'px';
}
function drawAsp(){mk($('asp'),Object.keys(A).map(function(k){return{t:k,v:k}}),function(){return st.ar},function(x){st.ar=x;save();fit();setupEnc()})}
function setDur(x){x=parseFloat(x);if(!isFinite(x))x=3;x=Math.min(15,Math.max(1,x));st.dur=x;$('dur').value=x;save();mk($('dch'),[2,3,5,10,15].map(function(n){return{t:n,v:n}}),function(){return st.dur},setDur)}
$('dur').onchange=function(){setDur(this.value)};
$('fl').onclick=function(){flash=!flash;this.classList.toggle('on',flash);this.setAttribute('aria-pressed',flash);this.textContent='Flash '+(flash?'nyala':'mati')};
$('gear').onclick=function(){
  mk($('rch'),[{t:'720p',v:'720'},{t:'1080p',v:'1080'},{t:'Maks',v:'max'}],function(){return st.res},function(x){st.res=x});
  mk($('fch'),[24,30,60].map(function(n){return{t:n,v:n}}),function(){return st.fps},function(x){st.fps=x});
  $('set').hidden=false;
};
$('apply').onclick=function(){$('set').hidden=true;save();startCam()};
window.addEventListener('resize',fit);v.addEventListener('resize',function(){fit();setupEnc()});

/* ---------- kamera + encoder H.264 (buffer terenkode) ---------- */
function crop(w,h,ar){
  if(!ar)return{x:0,y:0,w:w,h:h};
  var cw,ch;if(w/h>ar){cw=Math.round(h*ar);ch=h}else{cw=w;ch=Math.round(w/ar)}
  return{x:(w-cw)>>1,y:(h-ch)>>1,w:cw,h:ch};
}
async function startCam(){
  shot.disabled=true;say('Memulai kamera…');ring=[];
  try{
    if(stream)stream.getTracks().forEach(function(t){t.stop()});
    var r=R[st.res]||R['1080'];
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:r[0]},height:{ideal:r[1]},frameRate:{ideal:st.fps}}});
    track=stream.getVideoTracks()[0];ic=window.ImageCapture?new ImageCapture(track):null;
    v.srcObject=stream;
    await new Promise(function(ok){v.onloadedmetadata=ok});
    try{await v.play()}catch(e){}
    fit();await setupEnc();
    if(!looping){looping=true;v.requestVideoFrameCallback(loop)}
  }catch(e){say('Kamera tidak bisa dibuka. Izinkan akses kamera lalu muat ulang.')}
}
async function setupEnc(){
  if(!('VideoEncoder'in window)){say('Browser belum mendukung perekaman. Pakai Chrome Android terbaru. Konverter tetap bisa dipakai.');return}
  if(!v.videoWidth)return;
  shot.disabled=true;ring=[];desc=null;
  try{if(enc&&enc.state!=='closed')enc.close()}catch(e){}
  enc=null;
  cr=crop(v.videoWidth,v.videoHeight,A[st.ar]);
  cv.width=cr.w&~1;cv.height=cr.h&~1;
  var fps=st.fps,br=Math.min(40e6,Math.round(cv.width*cv.height*fps*.12)),cfg=null;
  var codecs=['avc1.640033','avc1.4d0033','avc1.420033'];
  for(var i=0;i<codecs.length&&!cfg;i++){
    var t={codec:codecs[i],width:cv.width,height:cv.height,bitrate:br,framerate:fps,latencyMode:'realtime',avc:{format:'avc'},hardwareAcceleration:'prefer-hardware'};
    try{var s=await VideoEncoder.isConfigSupported(t);if(s.supported)cfg=t}catch(e){}
  }
  if(!cfg){say('Resolusi ini tidak didukung encoder. Turunkan resolusi di Kualitas.');return}
  var e2=new VideoEncoder({output:onChunk,error:function(x){say('Encoder error: '+x.message)}});
  e2.configure(cfg);lastKey=-1e9;enc=e2;
  var set=track.getSettings();
  $('info').textContent=cv.width+'×'+cv.height+' · '+Math.round(set.frameRate||fps)+' fps';
  say('');shot.disabled=false;
}
function loop(now){
  v.requestVideoFrameCallback(loop);
  if(!enc||enc.state!=='configured'||enc.encodeQueueSize>4||!cr)return;
  try{
    g.drawImage(v,cr.x,cr.y,cr.w,cr.h,0,0,cv.width,cv.height);
    var ts=Math.round(now*1000),key=ts-lastKey>=500000;if(key)lastKey=ts;
    var f=new VideoFrame(cv,{timestamp:ts});enc.encode(f,{keyFrame:key});f.close();
  }catch(e){}
}
function onChunk(c,m){
  if(m&&m.decoderConfig&&m.decoderConfig.description){var d=m.decoderConfig.description;desc=new Uint8Array(d instanceof ArrayBuffer?d.slice(0):d.buffer.slice(d.byteOffset,d.byteOffset+d.byteLength))}
  var b=new Uint8Array(c.byteLength);c.copyTo(b);
  ring.push({ts:c.timestamp,key:c.type==='key',d:b});
  var last=c.timestamp;
  while(ring.length&&ring[0].ts<last-17e6)ring.shift();
  while(ring.length&&!ring[0].key)ring.shift();
  var span=ring.length?(last-ring[0].ts)/1e6:0;
  $('ring').style.setProperty('--p',Math.min(1,span/st.dur));
}

/* ---------- MP4 muxer (satu track H.264) ---------- */
function cat(a){var n=0;a.forEach(function(x){n+=x.length});var o=new Uint8Array(n),p=0;a.forEach(function(x){o.set(x,p);p+=x.length});return o}
function be(v,n){var a=new Uint8Array(n);for(var i=n-1;i>=0;i--){a[i]=v%256;v=Math.floor(v/256)}return a}
function str(s){return Uint8Array.from(s,function(c){return c.charCodeAt(0)})}
function box(t){var c=cat([].slice.call(arguments,1));return cat([be(c.length+8,4),str(t),c])}
function fb(t,ver,fl){return box.apply(null,[t,be(ver*16777216+fl,4)].concat([].slice.call(arguments,3)))}
function mux(S,w,h,avcC){
  var n=S.length,total=0,i;S.forEach(function(s){total+=s.dur});
  var mvdur=Math.round(total/1000),ftyp=box('ftyp',str('isom'),be(512,4),str('isom'),str('iso2'),str('avc1'),str('mp41'));
  var mat=cat([be(65536,4),be(0,4),be(0,4),be(0,4),be(65536,4),be(0,4),be(0,4),be(0,4),be(1073741824,4)]);
  var szs=[be(0,4),be(n,4)],tt=[be(n,4)],ks=[];
  S.forEach(function(s,i){szs.push(be(s.d.length,4));tt.push(be(1,4),be(s.dur,4));if(s.key)ks.push(be(i+1,4))});
  function moov(off){
    var mvhd=fb('mvhd',0,0,be(0,4),be(0,4),be(1000,4),be(mvdur,4),be(65536,4),be(256,2),be(0,10),mat,be(0,24),be(2,4));
    var tkhd=fb('tkhd',0,3,be(0,4),be(0,4),be(1,4),be(0,4),be(mvdur,4),be(0,8),be(0,2),be(0,2),be(0,2),be(0,2),mat,be(w*65536,4),be(h*65536,4));
    var mdhd=fb('mdhd',0,0,be(0,4),be(0,4),be(1e6,4),be(total,4),be(0x55C4,2),be(0,2));
    var hdlr=fb('hdlr',0,0,be(0,4),str('vide'),be(0,12),str('Video\0'));
    var avc1=box('avc1',be(0,6),be(1,2),be(0,16),be(w,2),be(h,2),be(0x480000,4),be(0x480000,4),be(0,4),be(1,2),be(0,32),be(24,2),be(0xFFFF,2),box('avcC',avcC));
    var stbl=box('stbl',fb('stsd',0,0,be(1,4),avc1),fb.apply(null,['stts',0,0].concat(tt)),fb.apply(null,['stss',0,0,be(ks.length,4)].concat(ks)),
      fb('stsc',0,0,be(1,4),be(1,4),be(n,4),be(1,4)),fb.apply(null,['stsz',0,0].concat(szs)),fb('stco',0,0,be(1,4),be(off,4)));
    var minf=box('minf',fb('vmhd',0,1,be(0,8)),box('dinf',fb('dref',0,0,be(1,4),fb('url ',0,1))),stbl);
    return box('moov',mvhd,box('trak',tkhd,box('mdia',mdhd,hdlr,minf)));
  }
  var off=ftyp.length+moov(0).length+8,data=0;S.forEach(function(s){data+=s.d.length});
  return new Blob([ftyp,moov(off),be(data+8,4),str('mdat')].concat(S.map(function(s){return s.d})),{type:'video/mp4'});
}

/* ---------- foto ---------- */
function toJpg(c){return new Promise(function(r){c.toBlob(r,'image/jpeg',.95)})}
async function grab(){
  var r=crop(v.videoWidth,v.videoHeight,A[st.ar]),c=document.createElement('canvas');c.width=r.w;c.height=r.h;
  c.getContext('2d').drawImage(v,r.x,r.y,r.w,r.h,0,0,r.w,r.h);return toJpg(c);
}
async function cropStill(b){
  var ar=A[st.ar];if(!ar)return b;
  var bm=await createImageBitmap(b),r=crop(bm.width,bm.height,ar),c=document.createElement('canvas');
  c.width=r.w;c.height=r.h;c.getContext('2d').drawImage(bm,r.x,r.y,r.w,r.h,0,0,r.w,r.h);bm.close();return toJpg(c);
}
async function torch(on){try{await track.applyConstraints({advanced:[{torch:on}]})}catch(e){}}

shot.onclick=async function(){
  if(busy||!ring.length||!desc)return;
  var D=st.dur*1e6,snap=ring.slice(),last=snap[snap.length-1].ts,idx=-1,i;
  for(i=snap.length-1;i>=0;i--){if(snap[i].key&&snap[i].ts<=last-D){idx=i;break}}
  if(idx<0)idx=snap.findIndex(function(s){return s.key});
  if(idx<0||snap.length-idx<3){say('Buffer belum terisi, tunggu sebentar.');return}
  var S=snap.slice(idx);busy=true;shot.disabled=true;say('Mengambil foto…');
  try{
    var still=null;
    if(ic){try{still=await ic.takePhoto(flash?{fillLightMode:'flash'}:{});still=await cropStill(still)}catch(e){still=null}}
    if(!still){if(flash){await torch(true);await sleep(250)}still=await grab();if(flash)await torch(false)}
    say('Memproses video…');
    var avg=Math.max(1,Math.round((S[S.length-1].ts-S[0].ts)/(S.length-1))),total=0;
    var smp=S.map(function(s,i){var nx=S[i+1],d=nx?Math.max(1,nx.ts-s.ts):avg;total+=d;return{d:s.d,key:s.key,dur:d}});
    var mp4=new Uint8Array(await mux(smp,cv.width,cv.height,desc).arrayBuffer());
    finish(build(new Uint8Array(await still.arrayBuffer()),mp4,total-avg),'MOTION_'+Date.now()+'.jpg',still);
    say('');
  }catch(e){say('Gagal: '+(e.message||e))}
  busy=false;shot.disabled=false;
};

/* ---------- gabung JPG + MP4 (Google Motion Photo) ---------- */
function sw(a,o,s){for(var i=0;i<s.length;i++)if(a[o+i]!==s.charCodeAt(i))return false;return true}
function build(jpg,mp4,tsUs){
  if(jpg[0]!==0xFF||jpg[1]!==0xD8)throw new Error('Foto bukan JPG yang valid.');
  var enc=new TextEncoder(),L=mp4.length;
  var xml='<?xpacket begin="\uFEFF" id="W5M0MpCehiHzreSzNTczkc9d"?><x:xmpmeta xmlns:x="adobe:ns:meta/"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">'+
  '<rdf:Description rdf:about="" xmlns:GCamera="http://ns.google.com/photos/1.0/camera/" xmlns:Container="http://ns.google.com/photos/1.0/container/" xmlns:Item="http://ns.google.com/photos/1.0/container/item/" '+
  'GCamera:MotionPhoto="1" GCamera:MotionPhotoVersion="1" GCamera:MotionPhotoPresentationTimestampUs="'+tsUs+'" GCamera:MicroVideo="1" GCamera:MicroVideoVersion="1" GCamera:MicroVideoOffset="'+L+'" GCamera:MicroVideoPresentationTimestampUs="'+tsUs+'">'+
  '<Container:Directory><rdf:Seq><rdf:li rdf:parseType="Resource"><Container:Item Item:Mime="image/jpeg" Item:Semantic="Primary" Item:Length="0" Item:Padding="0"/></rdf:li>'+
  '<rdf:li rdf:parseType="Resource"><Container:Item Item:Mime="video/mp4" Item:Semantic="MotionPhoto" Item:Length="'+L+'" Item:Padding="0"/></rdf:li></rdf:Seq></Container:Directory></rdf:Description></rdf:RDF></x:xmpmeta><?xpacket end="w"?>';
  var h=enc.encode('http://ns.adobe.com/xap/1.0/\x00'),b=enc.encode(xml),n=h.length+b.length+2,x=new Uint8Array(n+2);
  x[0]=0xFF;x[1]=0xE1;x[2]=n>>8;x[3]=n&255;x.set(h,4);x.set(b,4+h.length);
  var p=2,keep=[];
  while(p<jpg.length-3&&jpg[p]===0xFF){
    var m=jpg[p+1];if(m===0xDA)break;
    var len=(jpg[p+2]<<8)|jpg[p+3],seg=jpg.subarray(p,p+2+len);
    if(!(m===0xE1&&sw(seg,4,'http://ns.adobe.com/xap/1.0/')))keep.push(seg);
    p+=2+len;
  }
  var parts=[jpg.subarray(0,2)],ok=false;
  keep.forEach(function(s){if(!ok&&s[1]!==0xE0&&s[1]!==0xE1){parts.push(x);ok=true}parts.push(s)});
  if(!ok)parts.push(x);
  parts.push(jpg.subarray(p),mp4);
  return new Blob(parts,{type:'image/jpeg'});
}

/* ---------- hasil ---------- */
function finish(blob,name,prev){
  result={blob:blob,name:name};
  $('ri').src=URL.createObjectURL(prev||blob);
  $('rt').textContent='Motion photo siap ('+(blob.size/1048576).toFixed(1)+' MB)';
  $('res').hidden=false;
}
$('again').onclick=function(){$('res').hidden=true;URL.revokeObjectURL($('ri').src)};
$('sv').onclick=function(){
  var a=document.createElement('a');a.href=URL.createObjectURL(result.blob);a.download=result.name;
  document.body.appendChild(a);a.click();a.remove();$('rt').textContent='Tersimpan di folder Download.';
};
$('sh').onclick=async function(){
  var f=new File([result.blob],result.name,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
  else $('rt').textContent='Berbagi file tidak didukung. Pakai tombol Simpan.';
};

/* ---------- konverter ---------- */
var dv=0;
function pick(id,n,s){$(id).onchange=function(){var f=this.files[0];$(n).textContent=f?f.name:'Belum dipilih';$(s).classList.toggle('done',!!f);$('go').disabled=!($('img').files[0]&&$('vid').files[0])}}
pick('img','n1','s1');pick('vid','n2','s2');
$('vid').addEventListener('change',function(){
  var f=this.files[0];if(!f)return;
  var e=document.createElement('video'),u=URL.createObjectURL(f);e.preload='metadata';
  e.onloadedmetadata=function(){dv=isFinite(e.duration)?e.duration:0;if(dv)$('ts').value=(Math.floor(dv*10)/10).toFixed(1);URL.revokeObjectURL(u)};
  e.src=u;
});
$('go').onclick=async function(){
  try{
    var jf=$('img').files[0],vf=$('vid').files[0],sec=parseFloat($('ts').value);
    if(!isFinite(sec)||sec<0)sec=0;if(dv&&sec>dv)sec=dv;
    var blob=build(new Uint8Array(await jf.arrayBuffer()),new Uint8Array(await vf.arrayBuffer()),Math.round(sec*1e6));
    finish(blob,jf.name.replace(/\.[^.]+$/,'')+'_motion.jpg',jf);
  }catch(e){alert('Gagal: '+(e.message||e))}
};

drawAsp();setDur(st.dur);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
startCam();
})();
</script>
